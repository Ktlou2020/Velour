# Nixpacks build config (Railway). Everything else — the Node provider and
# version (package.json "engines": Node 22), install and build commands, and
# the start command in railway.toml — stays as auto-detected.
#
# "..." keeps the provider's default Nix packages (nodejs_22, npm). Extras:
#  - ffmpeg (includes ffprobe, libx264 and the AAC encoder). It is used to
#    re-encode uploaded videos with the owner's watermark burned in
#    (lib/storage.ts). If it is ever missing, uploads still work: videos are
#    stored as uploaded and the server logs "ffmpeg not available".
#  - postgresql_17: pg_dump / pg_restore / psql for scripts/backup.mjs (the
#    nightly backup cron service). pg_dump must be at least the server's major
#    version; 17 dumps Railway Postgres 16 and 17. If the database is ever
#    upgraded to 18, bump this (and check the Node 22 nixpkgs archive has it).
[phases.setup]
nixPkgs = ["...", "ffmpeg", "postgresql_17"]
