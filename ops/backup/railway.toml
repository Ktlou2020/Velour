# "db-backup" Railway service (Settings → Source → Root Directory: /ops/backup), runs once a day.
# 23:00 UTC = 01:00 SAST. See ../../scripts/restore.md to restore.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "node backup.mjs"
cronSchedule = "0 23 * * *"
restartPolicyType = "never"
